name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build artifacts without publishing release)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'linux-x64'
            os: 'ubuntu-24.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-x64'
            os: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-arm64'
            os: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-x64'
            os: 'macos-latest'
            target: 'x86_64-apple-darwin'

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf rpm

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        shell: bash
        run: |
          node scripts/validate-version.cjs
          node scripts/generate-changelog.cjs --check
          if command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1; then
            python3 scripts/third-party-notices.py --check
          else
            python scripts/third-party-notices.py --check
          fi
          npm run typecheck
          npm test

      - name: Configure signing environment
        run: |
          node -e '
            const secrets = {
              APPLE_CERTIFICATE: process.env.SEC_APPLE_CERT,
              APPLE_CERTIFICATE_PASSWORD: process.env.SEC_APPLE_CERT_PASS,
              APPLE_SIGNING_IDENTITY: process.env.SEC_APPLE_IDENTITY,
              APPLE_ID: process.env.SEC_APPLE_ID,
              APPLE_PASSWORD: process.env.SEC_APPLE_PASS,
              APPLE_TEAM_ID: process.env.SEC_APPLE_TEAM,
              TAURI_SIGNING_PRIVATE_KEY: process.env.SEC_TAURI_KEY,
              TAURI_SIGNING_KEY_PASSWORD: process.env.SEC_TAURI_KEY_PASS,
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD: process.env.SEC_TAURI_KEY_PASS
            };
            const fs = require("fs");
            const envFile = process.env.GITHUB_ENV;
            for (const [k, v] of Object.entries(secrets)) {
              if (v && v.trim().length > 0) {
                fs.appendFileSync(envFile, `${k}<<EOF\n${v}\nEOF\n`);
              }
            }
          '
        env:
          SEC_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          SEC_APPLE_CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SEC_APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SEC_APPLE_ID: ${{ secrets.APPLE_ID }}
          SEC_APPLE_PASS: ${{ secrets.APPLE_PASSWORD }}
          SEC_APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          SEC_TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SEC_TAURI_KEY_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_SIGNING_KEY_PASSWORD }}

      - name: Build Tauri application
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Normalise updater artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "Scanning bundle directory: $BUNDLE_DIR for version $VERSION"
          find "$BUNDLE_DIR" -maxdepth 3 -ls
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            find "$BUNDLE_DIR" -type f -name "Kinora.app.tar.gz" -exec mv {} "$BUNDLE_DIR/Kinora_${VERSION}_aarch64.app.tar.gz" \;
            find "$BUNDLE_DIR" -type f -name "Kinora.app.tar.gz.sig" -exec mv {} "$BUNDLE_DIR/Kinora_${VERSION}_aarch64.app.tar.gz.sig" \;
          elif [ "${{ matrix.platform }}" = "macos-x64" ]; then
            find "$BUNDLE_DIR" -type f -name "Kinora.app.tar.gz" -exec mv {} "$BUNDLE_DIR/Kinora_${VERSION}_x64.app.tar.gz" \;
            find "$BUNDLE_DIR" -type f -name "Kinora.app.tar.gz.sig" -exec mv {} "$BUNDLE_DIR/Kinora_${VERSION}_x64.app.tar.gz.sig" \;
          fi

      - name: Generate SHA-256 checksums (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.zip" \) -print0 | while IFS= read -r -d '' f; do
            hash=$(sha256sum "$f" | awk '{print $1}')
            printf "%s  %s\n" "$hash" "$(basename "$f")"
          done > SHA256SUMS-${{ matrix.platform }}.txt
          cat SHA256SUMS-${{ matrix.platform }}.txt

      - name: Generate SHA-256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location -Path "src-tauri/target/${{ matrix.target }}/release/bundle"
          $files = Get-ChildItem -Recurse -File -Include "*.exe", "*.msi", "*.zip"
          $hashes = foreach ($f in $files) {
            $h = Get-FileHash -Path $f.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($f.Name)"
          }
          $hashes | Out-File -Encoding ascii -FilePath "SHA256SUMS-${{ matrix.platform }}.txt"
          Get-Content "SHA256SUMS-${{ matrix.platform }}.txt"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kinora-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            !src-tauri/target/${{ matrix.target }}/release/bundle/**/build
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Verify & Publish Production Release
    needs: build
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version and determine release channel
        id: ver
        run: |
          node scripts/validate-version.cjs
          node scripts/generate-changelog.cjs --check
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" =~ - ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate SHA-256 checksums and release bundles
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -name "SHA256SUMS-*.txt" -exec cat {} + > release-dist/SHA256SUMS.txt
          find release-artifacts -type f \( -name "Kinora*" -a \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage*" -o -name "*.dmg" -o -name "*.exe*" -o -name "*.msi*" -o -name "*.tar.gz*" -o -name "*.zip*" \) \) -exec cp {} release-dist/ \;
          rm -f release-dist/Kinora.app.tar.gz release-dist/Kinora.app.tar.gz.sig
          echo "=== Release distribution contents ==="
          ls -la release-dist
          cat release-dist/SHA256SUMS.txt

      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        run: |
          node scripts/generate-sbom.cjs release-dist/kinora-sbom.json
          hash=$(sha256sum release-dist/kinora-sbom.json | awk '{print $1}')
          printf "%s  kinora-sbom.json\n" "$hash" >> release-dist/SHA256SUMS.txt

      - name: Generate latest.json updater manifest
        run: |
          node scripts/generate-updater-manifest.cjs

      - name: Verify all release assets, checksums, Minisign signatures, and updater manifest
        run: |
          node scripts/verify-release-assets.cjs --dir release-dist

      - name: Upload verified manifest and checksums (dry-run and audit artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kinora-release-verification-${{ steps.ver.outputs.version }}
          path: |
            release-dist/latest.json
            release-dist/SHA256SUMS.txt
            release-dist/kinora-sbom.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
          name: Kinora v${{ steps.ver.outputs.version }}
          body_path: docs/release/release-notes-v${{ steps.ver.outputs.version }}.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ steps.ver.outputs.is_prerelease == 'true' }}
