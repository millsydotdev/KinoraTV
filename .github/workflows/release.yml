name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build artifacts without publishing release)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'linux-x64'
            os: 'ubuntu-24.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-x64'
            os: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-arm64'
            os: 'macos-14'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-x64'
            os: 'macos-13'
            target: 'x86_64-apple-darwin'

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf rpm

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: |
          npm run typecheck
          npm test

      - name: Build Tauri application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Generate SHA-256 checksums (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} + > SHA256SUMS-${{ matrix.platform }}.txt
          cat SHA256SUMS-${{ matrix.platform }}.txt

      - name: Generate SHA-256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location -Path "src-tauri/target/${{ matrix.target }}/release/bundle"
          $files = Get-ChildItem -Recurse -File -Include "*.exe", "*.msi", "*.zip"
          $hashes = foreach ($f in $files) {
            $h = Get-FileHash -Path $f.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($f.Name)"
          }
          $hashes | Out-File -Encoding ascii -FilePath "SHA256SUMS-${{ matrix.platform }}.txt"
          Get-Content "SHA256SUMS-${{ matrix.platform }}.txt"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kinora-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            !src-tauri/target/${{ matrix.target }}/release/bundle/**/build
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate SHA-256 checksums and release bundles
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -name "SHA256SUMS-*.txt" -exec cat {} + > release-dist/SHA256SUMS.txt
          find release-artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-dist/ \;
          echo "=== Release distribution contents ==="
          ls -la release-dist
          cat release-dist/SHA256SUMS.txt

      - name: Publish GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
          generate_release_notes: true
          draft: true
          prerelease: false
