name: Promote Branch to Main

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Development or release branch to promote into main (e.g. v0.6.0 or release/0.7.0)'
        required: true
        type: string
      dry_run:
        description: 'Validate CI, release metadata and mergeability without creating or merging a PR'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Gated Promotion to Main
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch != 'main' &&
        (
          startsWith(github.event.workflow_run.head_branch, 'v') ||
          startsWith(github.event.workflow_run.head_branch, 'release/')
        ) &&
        vars.AUTO_MERGE_TO_MAIN == 'true'
      )
    steps:
      - name: Determine source branch and mode
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SRC="${{ inputs.source_branch }}"
            DRY="${{ inputs.dry_run }}"
          else
            SRC="${{ github.event.workflow_run.head_branch }}"
            DRY="false"
          fi
          if [ "$SRC" = "main" ]; then
            echo "::error::Source branch cannot be main."
            exit 1
          fi
          echo "source_branch=$SRC" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"

      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify all required CI checks passed for the exact source commit
        id: verify_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC="${{ steps.target.outputs.source_branch }}"
          git fetch origin "refs/heads/${SRC}:refs/remotes/origin/${SRC}"
          SRC_SHA=$(git rev-parse "refs/remotes/origin/${SRC}")
          echo "src_sha=$SRC_SHA" >> "$GITHUB_OUTPUT"
          echo "Source branch: $SRC ($SRC_SHA)"

          CI_PASS_COUNT=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SRC_SHA}&per_page=10" \
            --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [ "${CI_PASS_COUNT:-0}" -lt 1 ]; then
            echo "::error::Refusing to promote $SRC ($SRC_SHA): no passing CI workflow run found for this exact commit."
            exit 1
          fi

          REQUIRED_CHECKS=(
            "Secret & Credential Scanning"
            "Application Quality Gate & Security Audit"
            "Docker Environment & Security Validation"
            "Linux Package Compilation"
          )
          CHECK_JSON=$(gh api "repos/${{ github.repository }}/commits/${SRC_SHA}/check-runs?per_page=100")
          for check in "${REQUIRED_CHECKS[@]}"; do
            MATCH=$(echo "$CHECK_JSON" | jq --arg name "$check" '[.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length')
            if [ "${MATCH:-0}" -lt 1 ]; then
              echo "::error::Refusing to promote $SRC ($SRC_SHA): required check '$check' has not succeeded."
              exit 1
            fi
            echo "Verified required check passed: $check"
          done

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release metadata and mergeability against main
        id: validate
        run: |
          SRC="${{ steps.target.outputs.source_branch }}"
          SRC_SHA="${{ steps.verify_ci.outputs.src_sha }}"

          if git merge-base --is-ancestor "$SRC_SHA" HEAD; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            echo "main already contains all commits from $SRC ($SRC_SHA). Nothing to promote."
            exit 0
          fi
          echo "already_merged=false" >> "$GITHUB_OUTPUT"

          # Verify clean mergeability without pushing directly to main
          git merge --no-commit --no-ff "$SRC_SHA"
          node scripts/validate-version.cjs
          node scripts/generate-changelog.cjs --check
          VERSION=$(node -p "require('./package.json').version")
          NOTES_FILE="docs/release/release-notes-v${VERSION}.md"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::Missing or empty release notes file: $NOTES_FILE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git merge --abort 2>/dev/null || git reset --hard HEAD

          if git merge-base --is-ancestor HEAD "$SRC_SHA"; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update protected Pull Request and merge through GitHub branch protection
        id: pr
        if: steps.validate.outputs.already_merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC="${{ steps.target.outputs.source_branch }}"
          SRC_SHA="${{ steps.verify_ci.outputs.src_sha }}"
          VERSION="${{ steps.validate.outputs.version }}"

          if [ "${{ steps.target.outputs.dry_run }}" = "true" ]; then
            echo "Dry-run complete: $SRC ($SRC_SHA) passed all required CI checks, version ($VERSION), changelog, and clean-merge verification."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(gh pr list --base main --head "$SRC" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$SRC" \
              --title "Promote ${SRC} into main (Kinora v${VERSION})" \
              --body "Automated protected promotion of \`${SRC}\` (\`${SRC_SHA}\`) into \`main\` after all required CI checks passed. Merging strictly through GitHub branch protection rules with no bypass.")
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created promotion PR #${PR_NUMBER}: ${PR_URL}"
          else
            echo "Reusing existing open promotion PR #${PR_NUMBER}."
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Allow GitHub to index the newly opened PR against commit status checks
          sleep 5

          if gh pr merge "$PR_NUMBER" --merge; then
            echo "Protected PR #${PR_NUMBER} merged cleanly into main."
            MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "Immediate protected merge is waiting on branch protection requirements (e.g. up-to-date branch or pending checks). Enabling GitHub Auto-Merge."
            gh pr merge "$PR_NUMBER" --auto --merge
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger post-merge production verification and publishing on approved main commit
        if: steps.pr.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MERGE_SHA="${{ steps.pr.outputs.merge_sha }}"
          git fetch origin main
          echo "Dispatching post-merge CI on main ($MERGE_SHA)..."
          gh workflow run ci.yml --ref main

          CHANGED=$(git diff --name-only "${MERGE_SHA}^1" "${MERGE_SHA}" || true)
          if echo "$CHANGED" | grep -qE '^(Dockerfile|docker/|docker-compose\.yml|\.dockerignore|\.github/workflows/docker\.yml|package\.json|src-tauri/Cargo\.toml|src-tauri/Cargo\.lock|src-tauri/src/)'; then
            echo "Docker/server files changed in $MERGE_SHA: dispatching Docker Build & GHCR Publish..."
            gh workflow run docker.yml --ref main -f push_images=true
          else
            echo "No Docker/server files changed in $MERGE_SHA; skipping unnecessary Docker rebuild."
          fi

          PUBLISH_FLAG="false"
          if [ "${{ vars.AUTO_PUBLISH_MAIN_RELEASE }}" = "true" ]; then
            PUBLISH_FLAG="true"
          fi
          echo "Dispatching Release workflow on main (dry_run=false, publish_release=${PUBLISH_FLAG})..."
          gh workflow run release.yml --ref main -f dry_run=false -f publish_release="${PUBLISH_FLAG}"

      - name: Write promotion summary
        run: |
          {
            echo "### Kinora Protected Promotion Summary"
            echo "- **Source Branch:** \`${{ steps.target.outputs.source_branch }}\`"
            echo "- **Source Commit:** \`${{ steps.verify_ci.outputs.src_sha }}\`"
            echo "- **Dry Run:** \`${{ steps.target.outputs.dry_run }}\`"
            echo "- **Already Merged:** \`${{ steps.validate.outputs.already_merged }}\`"
            echo "- **Pull Request:** \`#${{ steps.pr.outputs.pr_number || 'none' }}\`"
            echo "- **Merged via Branch Protection:** \`${{ steps.pr.outputs.merged || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
