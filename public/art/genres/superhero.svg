<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02091c"/>
      <stop offset="50%" stop-color="#061838"/>
      <stop offset="100%" stop-color="#01050e"/>
    </linearGradient>
    <radialGradient id="beacon" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3a86ff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ff006e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#02091c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="50%" stop-color="#fb5607"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#beacon)"/>
  <polygon points="640,0 600,720 680,720" fill="#3a86ff" opacity="0.3"/>
  <polygon points="640,0 620,720 660,720" fill="#ffffff" opacity="0.45"/>
  <g>
    <polygon points="640,180 760,260 720,440 640,520 560,440 520,260" fill="#040e22" stroke="url(#crest)" stroke-width="6"/>
    <polygon points="640,220 720,280 690,420 640,470 590,420 560,280" fill="none" stroke="#ffbe0b" stroke-width="2" opacity="0.75"/>
    <polygon points="640,270 680,310 660,390 640,420 620,390 600,310" fill="url(#crest)" opacity="0.85"/>
  </g>
  <g opacity="0.8">
    <rect x="140" y="440" width="120" height="280" fill="#030b18"/>
    <rect x="290" y="380" width="100" height="340" fill="#020812"/>
    <rect x="890" y="390" width="110" height="330" fill="#020812"/>
    <rect x="1030" y="450" width="130" height="270" fill="#030b18"/>
  </g>
  <rect width="1280" height="720" fill="url(#vignette)"/>
