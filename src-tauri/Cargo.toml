[package]
name = "kinora"
version = "0.6.0"
description = "Kinora native shell (Tauri 2) hosting the React UI"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (Tauri convention).
name = "kinora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
# Already in the tree through Tauri: reads and writes the saved-sources file (sources.rs).
serde_json = "1"
# Playlist download only. No default features: no OS proxy settings, cookies, decompression or
# HTTP/2. TLS comes from the system OpenSSL. Proxy environment variables are still read unless the
# client calls `no_proxy()`, which src/fetch.rs does (see its tests).
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
# Already in the tree through Tauri; `net` adds the DNS lookup the guarded resolver checks, `time`
# and `sync` the stream protocol's timeouts, semaphores and cancellation channel.
tokio = { version = "1", features = ["net", "time", "sync", "io-util", "macros", "signal", "rt-multi-thread"] }
# Already in the tree through Tauri: the OS random source for unguessable stream handles.
getrandom = "0.3"
# Already in the tree through Tauri (plist, png). XMLTV guides (xmltv.rs): quick-xml never fetches
# external resources or expands declared entities; flate2 decompresses `.xml.gz` guides with a cap.
quick-xml = "0.42"
flate2 = "1"
resvg = { version = "0.49.0", default-features = false }
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
openssl = "0.10"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[features]
# Lets dev builds (`tauri dev`) fetch from 127.0.0.1 so native smoke tests can play local fixtures.
# Refuses to compile without Tauri's `dev` cfg, so it can never reach a release or bundled app.
loopback-fixtures = []
